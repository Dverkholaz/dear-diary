  :root {
    --bg: #f1f6fa; --card: #ffffff; --ink: #25303b; --muted: #70808e;
    --accent: #9fcdec; --accent-strong: #3f86b8; --accent-ink: #14364d;
    --bubble: #ffffff; --me: #dcecf8;
    --line: #dce6ee; --shadow: rgba(40,80,115,.09);
  }
  :root[data-theme="dark"] {
    --bg: #12171c; --card: #1a2128; --ink: #e8eef3; --muted: #93a1ad;
    --accent: #8ec6ec; --accent-strong: #a8d6f4; --accent-ink: #0f2433;
    --bubble: #1d262e; --me: #1f3549;
    --line: #29343d; --shadow: rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink);
         font: 16px/1.55 "Lora", Georgia, "Times New Roman", serif;
         display: flex; justify-content: center; transition: background .25s, color .25s; }
  button { font: inherit; color: inherit; }
  .app { width: 100%; max-width: 640px; height: 100dvh; display: flex; flex-direction: column; }

  header { padding: 12px 16px 12px 20px; display: flex; align-items: center; justify-content: space-between;
           gap: 10px; border-bottom: 1px solid var(--line); position: relative; z-index: 6; background: var(--bg); }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand h1 { font-size: 21px; font-weight: 600; margin: 0; letter-spacing: .2px; white-space: nowrap; }
  .brand span { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tools { display: flex; gap: 8px; }
  .icon { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: transparent;
          display: grid; place-items: center; cursor: pointer; color: var(--muted); padding: 0; flex: none; }
  .icon:hover { color: var(--accent-strong); border-color: var(--accent); }
  .icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8;
              stroke-linecap: round; stroke-linejoin: round; }
  :root[data-theme="dark"] .i-moon { display: none; }
  :root[data-theme="light"] .i-sun { display: none; }

  /* Страница дневника + перелистывание */
  .book { flex: 1; min-height: 0; position: relative; display: flex; perspective: 1800px; overflow: hidden; }
  #chat, .flip-inner { flex: 1; min-width: 0; overflow-y: auto; padding: 18px 16px;
                       display: flex; flex-direction: column; gap: 10px; }
  /* Мягкая страница: лист разрезан на узкие полоски, каждая повёрнута чуть сильнее предыдущей */
  .flip3d { position: absolute; inset: 0; z-index: 5; pointer-events: none; perspective: 2200px; }
  .flip-cast { position: absolute; top: 0; bottom: 0; left: 0; width: 0; opacity: 0;
               background: linear-gradient(to right, rgba(0,0,0,0) 0, rgba(0,0,0,.13) calc(100% - 34px), rgba(0,0,0,0) 100%); }
  .strip { position: absolute; top: 0; bottom: 0; transform-style: preserve-3d; transform-origin: left center; will-change: transform; }
  .face { position: absolute; inset: 0; overflow: hidden; background: var(--bg);
          -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  .face.back { transform: rotateY(180deg); }
  .face .shade { position: absolute; inset: 0; }
  .face .flip-inner { position: absolute; overflow: visible; flex: none; }
  .flip-inner .msg { animation: none; }

  .msg { max-width: 88%; padding: 11px 14px; border-radius: 16px; background: var(--bubble);
         box-shadow: 0 1px 2px var(--shadow); white-space: pre-wrap; word-wrap: break-word;
         animation: in .25s ease; }
  .msg.bot { align-self: flex-start; border-bottom-left-radius: 5px; }
  .msg.me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 5px; }
  .msg.mood { padding: 8px 14px; line-height: 0; color: var(--accent-strong); }
  .msg.mood .face-svg { width: 36px; height: 36px; }
  .msg.scheme { width: 88%; }
  .msg.scheme img { display: block; width: 100%; margin-top: 10px; border-radius: 10px; background: #fff; cursor: zoom-in; }
  .lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.86); display: flex;
              align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; animation: fade .2s ease; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; background: #fff; }
  .msg.scale-msg { width: 94%; max-width: 94%; }

  .face-svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 1.5;
              stroke-linecap: round; stroke-linejoin: round; }
  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; }
  .scale button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 6px 0 5px;
                  display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
  .scale button:hover:not(:disabled) { border-color: var(--accent); }
  .scale .n { font-size: 13px; font-weight: 600; }
  .scale .e { display: block; color: var(--muted); line-height: 0; }
  .scale button:hover:not(:disabled) .e { color: var(--accent-strong); }
  .scale button:disabled { cursor: default; opacity: .45; }
  .scale button.picked { opacity: 1; border-color: var(--accent); background: var(--me); }
  .scale button.picked .e { color: var(--accent-strong); }

  .summary { background: var(--card); border: 1px solid var(--line); }
  .summary .head i { color: var(--muted); }
  .summary .thanks { margin-top: 26px; }
  .summary .bye { margin-top: 8px; }
  .author { color: var(--muted); font-size: 12.5px; font-style: italic; line-height: 1.4; margin: 0; }
  .author.center { text-align: center; }
  .author a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  .author a:hover { color: var(--accent-strong); }
  .answers { padding-left: 20px; margin: 12px 0; }
  .answers li { margin-bottom: 10px; white-space: pre-wrap; }
  .answers li b { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }

  footer { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line);
           background: var(--bg); position: relative; z-index: 6; }
  .composer { display: flex; align-items: flex-end; gap: 6px; background: var(--card);
              border: 1px solid var(--line); border-radius: 26px; padding: 5px 5px 5px 18px;
              box-shadow: 0 1px 3px var(--shadow); transition: border-color .2s; }
  .composer:focus-within { border-color: var(--accent); }
  textarea { flex: 1; min-width: 0; resize: none; max-height: 140px; min-height: 38px; padding: 8px 0;
             border: 0; background: transparent; color: var(--ink); font: inherit; line-height: 1.45; outline: none; }
  textarea::placeholder { color: var(--muted); }
  button.send { width: 38px; height: 38px; flex: none; border: 0; border-radius: 50%; padding: 0;
                background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
                cursor: pointer; transition: opacity .2s, transform .15s; }
  button.send:hover:not(:disabled) { transform: translateY(-1px); }
  button.send:disabled { opacity: .4; cursor: default; }
  button.send svg { width: 20px; height: 20px; fill: currentColor; stroke: currentColor; stroke-width: 2.4; stroke-linejoin: round; }
  button.new { width: 100%; height: 48px; border: 0; border-radius: 14px; background: var(--accent);
               color: var(--accent-ink); font-weight: 600; cursor: pointer; }
  .hidden { display: none !important; }

  /* Календарь и страница дня */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end;
             justify-content: center; z-index: 10; animation: fade .2s ease; }
  .sheet { width: 100%; max-width: 640px; max-height: 90dvh; background: var(--bg); border-radius: 20px 20px 0 0;
           padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column;
           box-shadow: 0 -8px 30px rgba(0,0,0,.25); animation: up .25s ease; }
  .sheet.full { height: 100dvh; max-height: none; border-radius: 0; }
  @media (min-width: 700px) {
    .overlay { align-items: center; }
    .sheet { border-radius: 20px; max-height: 84dvh; }
    .sheet.full { height: 92dvh; max-height: 92dvh; border-radius: 20px; }
  }
  #calView, #dayView { display: flex; flex-direction: column; min-height: 0; }
  #dayView { flex: 1; transform-origin: left center; animation: pageIn .5s cubic-bezier(.2,.7,.2,1); }
  .cal-top, .day-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .cal-top h2 { font-size: 17px; margin: 0; flex: 1; text-align: center; }
  .cal-grid, .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-week { color: var(--muted); font-size: 12px; text-align: center; margin-bottom: 4px; }
  .cal-hint { color: var(--muted); font-size: 13px; text-align: center; margin: 14px 0 0; }
  .day { aspect-ratio: 1; max-height: 52px; border-radius: 12px; border: 1px solid transparent; background: transparent;
         cursor: pointer; position: relative; font-size: 15px; }
  .day:hover { background: var(--card); }
  .day.today { border-color: var(--accent); }
  .day.has::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 5px; height: 5px;
                    margin-left: -2.5px; border-radius: 50%; background: var(--accent-strong); }
  .day.sel { background: var(--accent); color: var(--accent-ink); }
  .day.sel::after { background: var(--accent-ink); }
  .day.empty { visibility: hidden; cursor: default; }

  .day-top .titles { flex: 1; min-width: 0; text-align: center; }
  .day-top h2 { font-size: 17px; margin: 0; }
  .day-top small { color: var(--muted); font-size: 13px; text-transform: capitalize; }
  .paper { flex: 1; min-height: 0; overflow-y: auto; background: var(--card); border: 1px solid var(--line);
           border-radius: 16px; padding: 6px 18px 18px; box-shadow: 0 2px 8px var(--shadow); }
  .entry { padding: 14px 0 6px; border-bottom: 1px dashed var(--line); }
  .entry:last-child { border-bottom: 0; }
  .entry .time { font-weight: 600; font-size: 14px; color: var(--accent-strong); }
  .entry .answers { margin: 8px 0 8px; }
  .none { color: var(--muted); padding: 24px 0; text-align: center; }

  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pageIn { from { opacity: 0; transform: perspective(1200px) rotateY(-14deg) translateX(18px); }
                      to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    #dayView, .sheet, .overlay, .msg { animation: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>Dear Diary</h1><span>дневник эмоций</span></div>
    <div class="tools">
      <button class="icon" id="calBtn" type="button" aria-label="Календарь записей" title="Календарь записей">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
      </button>
      <button class="icon" id="themeBtn" type="button" aria-label="Светлая или тёмная тема" title="Светлая / тёмная тема">
        <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="book" id="book"><div id="chat" aria-live="polite"></div></div>

  <footer>
    <form id="form" class="hidden">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Твой ответ…" aria-label="Твой ответ"></textarea>
        <button class="send" id="send" type="submit" aria-label="Отправить" title="Отправить" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5 L18.5 17.5 H5.5 Z"/></svg>
        </button>
      </div>
    </form>
    <button class="new hidden" id="newBtn" type="button">Новая запись</button>
  </footer>
</div>

<div class="overlay hidden" id="calOverlay">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Календарь записей">
    <div id="calView">
      <div class="cal-top">
        <button class="icon" id="prevM" type="button" aria-label="Предыдущий месяц"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <h2 id="monthTitle"></h2>
        <button class="icon" id="nextM" type="button" aria-label="Следующий месяц"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
        <button class="icon" id="closeCal" type="button" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="cal-week"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
      <div class="cal-grid" id="calGrid"></div>
      <p class="cal-hint">Нажми на дату, чтобы открыть страницу дня. Точкой отмечены дни с записями.</p>
      <p class="author center" style="margin-top:18px">Автор: Дарья Верхолаз, клинический психолог</p>
    </div>
    <div id="dayView" class="hidden">
      <div class="day-top">
        <button class="icon" id="backCal" type="button" aria-label="Назад к календарю"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="titles"><h2 id="dayTitle"></h2><small id="dayWeekday"></small></div>
        <button class="icon" id="closeDay" type="button" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="paper" id="dayPage"></div>
    </div>
  </div>
</div>

<div class="lightbox hidden" id="lightbox"><img alt="Схема"></div>

const REPLY_MID  = "Хорошо, расскажи, пожалуйста, подробнее.";
const REPLY_HIGH = "Это здорово! Расскажи, пожалуйста, подробнее.";
const replyFor = n => (n <= 2 ? REPLY_LOW : n === 3 ? REPLY_MID : REPLY_HIGH);

const $ = id => document.getElementById(id);
const chat = $("chat"), book = $("book"), footer = document.querySelector("footer"), form = $("form"), input = $("input"), sendBtn = $("send"), newBtn = $("newBtn");

function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function safeSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
const pad = n => String(n).padStart(2, "0");
const reduceMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

let name = safeGet("dd_name") || "";
let step = -1, answers = {}, startedAt = null, awaitingName = false;

/* ---------- Лица для шкалы ---------- */
// Минималистичные линейные лица: рот меняется от грустного (i=0) к улыбке (i=4)
function faceSVG(i) {
  const c = -4 + 2 * i;                     // изгиб рта: -4 … +4
  const y = (15.5 + c * 0.9).toFixed(2);
  let eyes;
  if (i === 0) {          // грусть: скошенные «печальные» глаза
    eyes = '<path d="M7.3 11 L10.3 9.2M16.7 11 L13.7 9.2"/>';
  } else if (i === 4) {   // радость: глаза-дуги «^ ^»
    eyes = '<path d="M7.3 10.8 Q8.8 8.4 10.3 10.8M13.7 10.8 Q15.2 8.4 16.7 10.8"/>';
  } else {
    eyes = '<circle cx="8.8" cy="10" r="1.1" fill="currentColor" stroke="none"/>' +
           '<circle cx="15.2" cy="10" r="1.1" fill="currentColor" stroke="none"/>';
  }
  return '<svg class="face-svg" viewBox="0 0 24 24" aria-hidden="true">' +
    '<circle cx="12" cy="12" r="9.5"/>' + eyes +
    `<path d="M8 15.5 Q12 ${y} 16 15.5"/></svg>`;
}

/* ---------- Чат ---------- */
function scrollDown() { chat.scrollTop = chat.scrollHeight; }

function addMsg(text, who, cls = "") {
  const el = document.createElement("div");
  el.className = `msg ${who} ${cls}`.trim();
  el.textContent = text;
  chat.appendChild(el);
  scrollDown();
  return el;
}

function addFaceMsg(i) {
  const el = document.createElement("div");
  el.className = "msg me mood";
  el.setAttribute("role", "img");
  el.setAttribute("aria-label", `${i + 1} из 5`);
  el.innerHTML = faceSVG(i);
  chat.appendChild(el);
  scrollDown();
}

function addSchemeMessage() {
  const el = document.createElement("div");
  el.className = "msg bot scheme";
  el.appendChild(document.createTextNode("Если эмоции сложно описать, можешь выбрать наиболее подходящие из схемы ниже"));
  const img = document.createElement("img");
  img.alt = "Схема";
  img.title = "Нажми, чтобы увеличить";
  img.src = SCHEME_SRC;
  img.onload = scrollDown;
  img.onclick = openLightbox;
  el.appendChild(img);
  const cr = document.createElement("div");
  cr.className = "author";
  cr.style.marginTop = "8px";
  cr.textContent = "Схема эмоций: Роберт Плутчик";
  el.appendChild(cr);
  chat.appendChild(el);
  scrollDown();
}

function openLightbox() {
  $("lightbox").querySelector("img").src = SCHEME_SRC;
  $("lightbox").classList.remove("hidden");
}
function closeLightbox() { $("lightbox").classList.add("hidden"); }
$("lightbox").addEventListener("click", closeLightbox);

function addScale() {
  const el = document.createElement("div");
  el.className = "msg bot scale-msg";
  el.appendChild(document.createTextNode(QUESTIONS[0].text));
  const grid = document.createElement("div");
  grid.className = "scale";
  for (let i = 0; i < 5; i++) {
    const n = i + 1;
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-label", `${n} из 5`);
    b.innerHTML = '<span class="n"></span><span class="e"></span>';
    b.querySelector(".n").textContent = n;
    b.querySelector(".e").innerHTML = faceSVG(i);
    b.onclick = () => {
      grid.querySelectorAll("button").forEach(x => x.disabled = true);
      b.classList.add("picked");
      startedAt = new Date(); // время ответа на первый вопрос
      answers.feeling = `${n} из 5`;
      addFaceMsg(i);                                   // ответ — смайликом
      setTimeout(() => {
        addMsg(replyFor(n), "bot");                    // реплика в зависимости от оценки
        setTimeout(next, 800);
      }, 450);
    };
    grid.appendChild(b);
  }
  el.appendChild(grid);
  chat.appendChild(el);
  scrollDown();
}

/* режимы нижней панели: input | scale | done */
function setMode(mode, placeholder) {
  footer.classList.toggle("hidden", mode === "scale");   // на шаге со смайликами нижней панели нет
  form.classList.toggle("hidden", mode !== "input");
  newBtn.classList.toggle("hidden", mode !== "done");
  if (placeholder) input.placeholder = placeholder;
  if (mode === "input") input.focus({ preventScroll: true });
  requestAnimationFrame(scrollDown);
}

function autosize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
  sendBtn.disabled = !input.value.trim();
}

function formatDate(d) {
  return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ---------- Перелистывание страницы ---------- */
function flipPage(then) {
  if (reduceMotion() || !chat.children.length || !book.clientWidth) { chat.innerHTML = ""; then(); return; }

  const N = 18;                                   // на сколько полосок «гнётся» лист
  const W = book.clientWidth, w = W / N;
  const contentW = chat.clientWidth, top = chat.scrollTop, fullH = chat.scrollHeight;

  const wrap = document.createElement("div");
  wrap.className = "flip3d";
  const cast = document.createElement("div");     // мягкая тень листа на чистой странице
  cast.className = "flip-cast";
  wrap.appendChild(cast);

  // Каждая полоска вложена в предыдущую и поворачивается относительно её края
  const strips = [];
  let parent = wrap;
  for (let k = 0; k < N; k++) {
    const s = document.createElement("div");
    s.className = "strip";
    s.style.width = (w + 0.8) + "px";             // небольшой нахлёст, чтобы не было швов
    s.style.left = (k === 0 ? 0 : w) + "px";

    const front = document.createElement("div"); front.className = "face front";
    const snap = chat.cloneNode(true);            // снимок текущей страницы
    snap.removeAttribute("id"); snap.removeAttribute("aria-live");
    snap.className = "flip-inner";
    snap.style.cssText = `left:${-k * w}px;top:${-top}px;width:${contentW}px;height:${fullH}px;`;
    const shF = document.createElement("div"); shF.className = "shade";
    front.append(snap, shF);

    const back = document.createElement("div"); back.className = "face back";   // оборот листа
    const shB = document.createElement("div"); shB.className = "shade";
    back.appendChild(shB);

    s.append(front, back);
    parent.appendChild(s);
    parent = s;
    strips.push({ s, shF, shB });
  }
  book.appendChild(wrap);
  chat.innerHTML = "";                            // под листом — чистая страница
  then();

  const dur = 1300, D = Math.PI / 180, t0 = performance.now();
  const lit = a => { const c = Math.cos(a * D); return [0.17 * (1 - Math.max(c, 0)), 0.17 * (1 - Math.max(-c, 0)) + 0.04]; };
  const apply = p => {
    const ease = (1 - Math.cos(Math.PI * p)) / 2;                       // мягкий старт и финиш
    const r0 = -180 * ease;                                             // поворот у корешка
    const bend = -85 * Math.pow(Math.sin(Math.PI * p), 1.1);            // изгиб: сильнее всего посередине
    const A = strips.map((_, k) => Math.max(r0 + bend * Math.pow(k / (N - 1), 1.4), -180)); // край листа «ведёт» за собой
    let prev = 0, x = 0, maxX = 0;
    strips.forEach((st, k) => {
      st.s.style.transform = `rotateY(${(A[k] - prev).toFixed(2)}deg)`;
      prev = A[k];
      // тень плавно переходит от полоски к полоске — без ступенек
      const aL = k === 0 ? A[0] : (A[k - 1] + A[k]) / 2;
      const aR = k === N - 1 ? A[k] : (A[k] + A[k + 1]) / 2;
      const [fL, bL] = lit(aL), [fR, bR] = lit(aR);
      st.shF.style.background = `linear-gradient(to right, rgba(0,0,0,${fL.toFixed(3)}), rgba(0,0,0,${fR.toFixed(3)}))`;
      st.shB.style.background = `linear-gradient(to left, rgba(0,0,0,${bL.toFixed(3)}), rgba(0,0,0,${bR.toFixed(3)}))`;
      x += w * Math.cos(A[k] * D); if (x > maxX) maxX = x;
    });
    cast.style.width = (Math.max(maxX, 0) + 34) + "px";
    cast.style.opacity = Math.pow(Math.sin(Math.PI * p), 1.6).toFixed(3);
  };
  const frame = now => {
    const p = Math.min(1, (now - t0) / dur);
    apply(p);
    if (p < 1) requestAnimationFrame(frame); else wrap.remove();
  };
  apply(0);
  requestAnimationFrame(frame);
  setTimeout(() => wrap.remove(), dur + 500);
}

/* ---------- Сценарий ---------- */
function askName() {
  awaitingName = true;
  addMsg("Привет! Меня зовут Dear Diary, как могу обращаться к тебе?", "bot");
  setMode("input", "Твоё имя или ник…");
}

function introduce() {
  addMsg(
`Приятно познакомиться, ${name}

Dear Diary — это дневник эмоций, помогающий более чутко отслеживать свои состояния и их составляющие.

Регулярные записи делают переживания понятнее, помогают замечать повторяющиеся сценарии и приносить на встречи с психологом подробный материал для работы.`, "bot");
  const el = chat.lastElementChild;
  const a = document.createElement("div");
  a.className = "author";
  a.style.marginTop = "14px";
  a.append("Автор: " + AUTHOR + " · ");
  const mail = document.createElement("a");
  mail.href = "mailto:" + AUTHOR_EMAIL;
  mail.textContent = AUTHOR_EMAIL;
  a.appendChild(mail);
  el.appendChild(a);
  const m = document.createElement("div");
  m.className = "author";
  m.style.marginTop = "4px";
  m.textContent = "В основе дневника — методика Альберта Эллиса";
  el.appendChild(m);
  scrollDown();
}

function beginEntry() {
  answers = {}; startedAt = null; step = -1;
  next();
}

function startEntry(withFlip) {
  if (withFlip) flipPage(() => { setMode("scale"); beginEntry(); });
  else { setMode("scale"); beginEntry(); }
}

function next() {
  step++;
  if (step >= QUESTIONS.length) return finish();
  const q = QUESTIONS[step];
  setMode("scale");
  setTimeout(() => {
    if (q.scale) { addScale(); return; }
    addMsg(q.text, "bot");
    if (q.scheme) addSchemeMessage();
    setMode("input", "Твой ответ…");
  }, step === 0 ? 450 : 350);
}

function buildAnswersList(a) {
  const ol = document.createElement("ol");
  ol.className = "answers";
  QUESTIONS.filter(q => q.key !== "feeling").forEach(q => {   // самочувствие в записи не выводим
    const li = document.createElement("li");
    const b = document.createElement("b"); b.textContent = q.label;
    li.appendChild(b);
    li.appendChild(document.createTextNode((a && a[q.key]) || "—"));
    ol.appendChild(li);
  });
  return ol;
}

function finish() {
  const el = document.createElement("div");
  el.className = "msg bot summary";
  const head = document.createElement("div");
  head.className = "head";
  head.appendChild(document.createTextNode("Твоя запись в дневнике эмоций"));
  head.appendChild(document.createElement("br"));
  const i = document.createElement("i"); i.textContent = formatDate(startedAt);
  head.appendChild(i);
  const thanks = document.createElement("div");
  thanks.className = "thanks";
  thanks.textContent = "Спасибо, что делишься своими переживаниями 🍃";
  const bye = document.createElement("div");
  bye.className = "bye";
  bye.textContent = "До встречи!";
  el.append(head, buildAnswersList(answers), thanks, bye);
  chat.appendChild(el);
  scrollDown();
  saveHistory();
  setMode("done");
}

/* ---------- История и календарь ---------- */
function loadHistory() {
  try {
    const list = JSON.parse(safeGet("dd_history") || "[]");
    return Array.isArray(list) ? list : [];
  } catch (e) { return []; }
}

function saveHistory() {
  const list = loadHistory();
  list.push({ at: startedAt.toISOString(), answers });
  safeSet("dd_history", JSON.stringify(list));
}

const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

let viewYear, viewMonth, selectedKey = null;

function entriesByDay() {
  const map = {};
  loadHistory().forEach(e => {
    const d = new Date(e.at);
    if (isNaN(d)) return;
    (map[dayKey(d)] = map[dayKey(d)] || []).push({ date: d, answers: e.answers });
  });
  Object.values(map).forEach(arr => arr.sort((a, b) => a.date - b.date));
  return map;
}

function renderCalendar() {
  const map = entriesByDay();
  $("monthTitle").textContent = `${MONTHS_NOM[viewMonth]} ${viewYear}`;
  const grid = $("calGrid");
  grid.innerHTML = "";
  const offset = (new Date(viewYear, viewMonth, 1).getDay() + 6) % 7; // неделя с понедельника
  const days = new Date(viewYear, viewMonth + 1, 0).getDate();
  const todayKey = dayKey(new Date());
  for (let i = 0; i < offset; i++) {
    const s = document.createElement("span"); s.className = "day empty"; grid.appendChild(s);
  }
  for (let d = 1; d <= days; d++) {
    const key = `${viewYear}-${pad(viewMonth + 1)}-${pad(d)}`;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "day" + (map[key] ? " has" : "") + (key === todayKey ? " today" : "") + (key === selectedKey ? " sel" : "");
    b.textContent = d;
    b.setAttribute("aria-label", `${d} ${MONTHS_GEN[viewMonth]}${map[key] ? ", есть записи" : ""}`);
    b.onclick = () => openDay(key);
    grid.appendChild(b);
  }
}

function showCalView() {
  $("sheet").classList.remove("full");
  $("dayView").classList.add("hidden");
  $("calView").classList.remove("hidden");
}

function openDay(key) {
  selectedKey = key;
  const [y, m, d] = key.split("-").map(Number);
  $("dayTitle").textContent = `${d} ${MONTHS_GEN[m - 1]} ${y}`;
  $("dayWeekday").textContent = new Date(y, m - 1, d).toLocaleDateString("ru-RU", { weekday: "long" });
  const page = $("dayPage");
  page.innerHTML = "";
  const list = entriesByDay()[key] || [];
  if (!list.length) {
    const p = document.createElement("div"); p.className = "none"; p.textContent = "В этот день записей нет.";
    page.appendChild(p);
  }
  list.forEach(e => {
    const card = document.createElement("div"); card.className = "entry";
    const t = document.createElement("div"); t.className = "time";
    t.textContent = `${pad(e.date.getHours())}:${pad(e.date.getMinutes())}`;
    card.append(t, buildAnswersList(e.answers));
    page.appendChild(card);
  });
  $("calView").classList.add("hidden");
  $("sheet").classList.add("full");
  const dv = $("dayView");
  dv.classList.remove("hidden");
  dv.style.animation = "none"; void dv.offsetWidth; dv.style.animation = ""; // перезапуск «перелистывания»
  page.scrollTop = 0;
  $("backCal").focus();
}

function openCalendar() {
  const now = new Date();
  viewYear = now.getFullYear(); viewMonth = now.getMonth(); selectedKey = null;
  showCalView();
  $("calOverlay").classList.remove("hidden");
  renderCalendar();
  $("closeCal").focus();
}
function closeCalendar() { $("calOverlay").classList.add("hidden"); showCalView(); $("calBtn").focus(); }
function backToCalendar() { showCalView(); renderCalendar(); $("closeCal").focus(); }
function shiftMonth(delta) {
  const d = new Date(viewYear, viewMonth + delta, 1);
  viewYear = d.getFullYear(); viewMonth = d.getMonth();
  renderCalendar();
}

$("calBtn").addEventListener("click", openCalendar);
$("closeCal").addEventListener("click", closeCalendar);
$("closeDay").addEventListener("click", closeCalendar);
$("backCal").addEventListener("click", backToCalendar);
$("prevM").addEventListener("click", () => shiftMonth(-1));
$("nextM").addEventListener("click", () => shiftMonth(1));
$("calOverlay").addEventListener("click", e => { if (e.target === $("calOverlay")) closeCalendar(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("lightbox").classList.contains("hidden")) { closeLightbox(); return; }
  if (e.key !== "Escape" || $("calOverlay").classList.contains("hidden")) return;
  if (!$("dayView").classList.contains("hidden")) backToCalendar(); else closeCalendar();
});

/* ---------- Тема ---------- */
$("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const t = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", t);
  safeSet("dd_theme", t);
});

/* ---------- Ввод ---------- */
form.addEventListener("submit", e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = ""; autosize();
  addMsg(text, "me");

  if (awaitingName) {
    awaitingName = false; name = text; safeSet("dd_name", name);
    introduce(); startEntry(false); return;
  }
  answers[QUESTIONS[step].key] = text;
  next();
});

input.addEventListener("input", autosize);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
});
newBtn.addEventListener("click", () => startEntry(true));

/* ---------- Экранная клавиатура ---------- */
// Chrome на Android и Safari на iPhone по умолчанию не уменьшают страницу под клавиатуру,
// и она закрывает поле ввода и последние сообщения. Подгоняем высоту под видимую часть экрана.
(function () {
  const vv = window.visualViewport;
  if (!vv) return;
  const app = document.querySelector(".app");
  function fit() {
    const hidden = window.innerHeight - vv.height;
    if (hidden > 80) {                                   // клавиатура открыта
      app.style.height = vv.height + "px";
      app.style.transform = vv.offsetTop ? `translateY(${vv.offsetTop}px)` : "";
    } else {
      app.style.height = "";
      app.style.transform = "";
    }
    scrollDown();
  }
  vv.addEventListener("resize", fit);
  vv.addEventListener("scroll", fit);
  input.addEventListener("focus", () => setTimeout(fit, 300));
})();

/* ---------- Старт ---------- */
if (name) { addMsg(`Привет, ${name}!`, "bot"); startEntry(false); } else { askName(); }
autosize();
</script>
</body>
</html>
